name: "Household Calendar"
slug: "household_calendar"
description: "A local, bill-focused weekly calendar for Home Assistant"
version: "0.3.0"
image: "ghcr.io/krbielec/household-calendar"
startup: application
boot: auto
homeassistant: ">=2024.12.0"
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-edit
panel_title: Household Calendar
panel_admin: true
arch:
  - amd64
  - aarch64
map:
  - config:rw
options:
  timezone: "Europe/Warsaw"
schema:
  timezone: str

name: Build and publish Home Assistant app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            image: ghcr.io/krbielec/amd64-household-calendar
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: ghcr.io/krbielec/aarch64-household-calendar
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish architecture image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./household_calendar
          image: ${{ matrix.image }}
          image-tags: |
            0.4.0
            latest
          push: "true"
          version: "0.4.0"

  publish-manifest:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: '["amd64", "aarch64"]'
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: household-calendar
          image-tags: |
            0.4.0
            latest
          registry-prefix: ghcr.io/krbielec
